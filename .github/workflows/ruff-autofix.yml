name: Temporary Ruff Autofix

on:
  push:
    branches:
      - audit-web-hardening

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply Ruff autofixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install "ruff>=0.8,<1"
      - name: Apply safe Ruff fixes
        run: ruff check --fix . || true
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff autofixes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply Ruff autofixes"
          git push
