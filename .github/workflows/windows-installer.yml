name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main, audit-web-hardening]
    paths:
      - 'client/**'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: client/requirements.txt
      - name: Install desktop build dependencies
        run: python -m pip install -r client/requirements.txt PyInstaller
      - name: Build desktop executable
        working-directory: client
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PrintOrderManager-MultiStore app.py
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
      - name: Build Inno Setup installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\PrintOrderManager.iss'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PrintOrderManager-Windows-Installer
          path: installer/output/PrintOrderManager-MultiStore-Setup.exe
          if-no-files-found: error
