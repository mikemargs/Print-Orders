services:
  - type: web
    name: print-order-manager
    runtime: docker
    region: virginia
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_COOKIE_SECURE
        value: "true"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: print-artwork
      - key: MAX_UPLOAD_BYTES
        value: "262144000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: BOOTSTRAP_COMPANY_NAME
        sync: false
      - key: BOOTSTRAP_COMPANY_CODE
        sync: false
      - key: BOOTSTRAP_COMPANY_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL_SAYVILLE
        sync: false
      - key: NOTIFY_EMAIL_SELDEN
        sync: false
      - key: NOTIFY_EMAIL_MT_SINAI
        sync: false
      - key: NOTIFY_EMAIL_ADDITIONAL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
